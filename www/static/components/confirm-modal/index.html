<button class="trigger">Display a confirm dialog</button>
<script src="https://code.jquery.com/jquery-1.11.3.min.js"></script>
<script src="jquery.confirm-action.js"></script>
<script>
$('.trigger').confirmAction({
  title: {
    text: 'Confirm Dialog'
  },
  message: {
    text: 'Are you sure?'
  },
  actions: {
    confirm: {
      text: 'Okey',
      callback: function(confirm, cancel) {
        confirm();
      }
    }
  }
});
</script>
