server {
    listen 80;
    server_name dev01.test.artistsupplysource.com dev1.test.artistsupplysource.com dev1.artistsupplysource.com;

    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name dev01.test.artistsupplysource.com dev1.test.artistsupplysource.com dev1.artistsupplysource.com;

    root /var/www/development/www;

    access_log /var/www/development/log/nginx-access.log combined;
    error_log /var/www/development/log/nginx-error.log error;

    include /srv/nginx/configs/limit_connections.conf;
    include /srv/nginx/configs/compress.conf;

    include /srv/nginx/configs/stores_ssl.conf;
    #include /srv/nginx/configs/stores_base.conf;
    include /srv/nginx/configs/stores_new_design.conf;
}