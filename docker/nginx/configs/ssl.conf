    ##
    # SSL
    ##
    ssl_protocols             TLSv1.2;
    ssl_session_tickets off;
    ssl_session_cache         shared:SSL:50m;
    ssl_session_timeout       10m;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    # Don't forget to set `ssl_trusted_certificate` to the chain of your cert in the `server` block.
    resolver                  8.8.8.8 8.8.4.4;  # replace with `127.0.0.1` if you have a local dns server
    ssl_prefer_server_ciphers on;
    ssl_dhparam               /etc/letsencrypt/ssl-dhparams.pem;  # openssl dhparam -out ssl/dhparam.pem 4096

    ssl_certificate /etc/letsencrypt/live/s3stores/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s3stores/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/s3stores/chain.pem;