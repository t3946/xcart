server {

    listen 80;
    index index index.php controllers.php controller.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/www;

    location ~ ^/(provider|admin)/$ {
        include configs/stores_admin_auth.conf;
    }

    location ~ ^/(modules|var|includes).* {
        return 301 /;
    }

    location ~ /include/.*/.* {
        return 301 /;
    }

    location ~ ^/account {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_pass http://nextjs_upstream;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
    }



    location ~* ^.+\.(css|js)$ {
        expires 31536000;
    }
    location ~* ^.+\.(jpg|jpeg|gif|png|svg|bpm)$ {
        expires 31536000;
        add_header Cache-Control "public";

        log_not_found off;
        access_log off;
    }

    location ~* ^.+\.(ttf|woff|woff2|eot)$ {
        add_header Access-Control-Allow-Origin *;
        expires 31536000;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.php?$args;
        gzip_static on;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
        gzip_static on;
    }

    client_max_body_size 0;
}