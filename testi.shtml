Descriptions[6] = "This is to let you know that I received my brushes in record time; I was very impressed by the speed of the delivery. The quality is far superior to any brushes that I have ever used before and I look forward to hours of indulging in my favorite pastime. Thank you so much.  Sincerely, Barbara J.  undefinedjones1110@peoplepc.com";

Descriptions[10] = "I wanted to let you know my brushes arrived today and I am well pleased. Thank you for your prompt service.  Joyce Ishee  Ishee@Starband.net";

Descriptions[12] = "I recently received your shipment of brushes. I thought I would put them through a series of tests. Let me tell you what a surprise I had! They performed as well as my expensive Kolinsky sables. They held a great deal of paint, they maintained a point, the bristles had a bounce ... all the great qualities I look for in my brushes but at a fraction of the price. I will definitely recommend these brushes to my students. Thanks again, it's been a pleasure dealing with you.  Carolyn R.";
Descriptions[13] = "I was buying Windsor Newton sable brushes. Your brushes are better because they are stiffer and the sable does not fall out.  Marvin Steel  artfixer@bellsouth.net";
Descriptions[14] = "My introductory set of 5 Kolinsky brushes has just arrived. About a week or two sooner than I ever expected them to considering I live in Australia. I've immediately tried the number 8 round and boy, does it pass the test. It's great! I take very good care of my brushes (most are well over 25 years old) because I feel very bad about animals being hunted for my benefit. I will surely enjoy these for a long time to come.  Sincerely, Sophia  sophiam@kooee.com.au";
