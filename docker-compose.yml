  certbot:
    container_name: certbot
    image: certbot/dns-route53
    networks:
      - frontend
    depends_on:
      - nginx
    tty: true
    entrypoint: "/bin/sh -c 'trap exit TERM;
     certbot certonly -n --cert-name s3stores --dns-route53 --agree-tos --email romann@s3stores.com --staging
     -d s3stores.com
     -d www.s3stores.com;
     while :; do certbot renew; sleep 24h & wait $${!}; done;'"
    volumes:
      - ./docker/certbot/conf:/etc/letsencrypt
    environment:
      AWS_ACCESS_KEY_ID: AKIA5YFRXSHY7JXWQAIR
      AWS_SECRET_ACCESS_KEY: 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

