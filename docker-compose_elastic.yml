version: '3.7'

services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.16.3
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.authc.api_key.enabled=true
      - ELASTIC_PASSWORD=admin
      - "ES_JAVA_OPTS=-Xms4g -Xmx4g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - data1:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - elastic

  ent-search:
    image: docker.elastic.co/enterprise-search/enterprise-search:7.16.3
    container_name: ent-search
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      - "JAVA_OPTS=-Xms2g -Xmx2g"
      - ENT_SEARCH_DEFAULT_PASSWORD=adminpass
      - elasticsearch.username=elastic
      - elasticsearch.password=admin
      - elasticsearch.host=http://elasticsearch:9200
      - allow_es_settings_modification=true
      - secret_management.encryption_keys=[4a2cd3f81d39bf28738c10db0ca782095ffac07279561809eecc722e0c20eb09]
      - elasticsearch.startup_retry.interval=15
      - ent_search.external_url=http://68.168.211.58:3002
    ports:
      - "3002:3002"
    networks:
      - elastic

  kibana:
    image: docker.elastic.co/kibana/kibana:7.16.3
    container_name: kibana
    restart: unless-stopped
    depends_on:
      - elasticsearch
      - ent-search
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTs: http://elasticsearch:9200
      ENTERPRISESEARCH_HOST: http://ent-search:3002
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: admin
    networks:
      - elastic

volumes:
  data1:
    driver: local


networks:
  elastic:
