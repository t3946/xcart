   <TITLE>Millimeter To Inch Converter | Art Brushes Store</TITLE>

<script LANGUAGE="JavaScript">
<!-- Beginning of JavaScript -

function mmtoinch() {
	var mm = Math.round(document.forms[0].mm.value*100)/100
	var inch = mm * .03937
	document.forms[0].mm.value = mm
	document.forms[0].inch.value = Math.round(inch*1000)/1000	
	fraction(inch)
}
function inchtomm() {
	var inch = Math.round(document.forms[0].inch.value*1000)/1000
	var mm = inch / .03937
	document.forms[0].inch.value = inch
	document.forms[0].mm.value = Math.round(mm*100)/100	
	fraction(inch)
}

function fraction(inches) {
	var num = Math.floor(inches)
	var deci = inches - num
	var frac = Math.round(deci*64)
	if (frac==0){
		document.forms[0].fraction.value = num
	}else if (frac==64){
		document.forms[0].fraction.value = num + 1
	}else {
		var i = 6 
		while (i>0){
			i--
			if (frac%2==0){
				var frac= Math.round(frac/2)
				var denom=Math.pow(2,i)
			}else if (frac%2==1){
				var denom=Math.pow(2,i+1)
				var i = 0
			}
		}
		if (num==0){
			document.forms[0].fraction.value = frac+"/"+denom
		}else{
			document.forms[0].fraction.value = num+" "+frac+"/"+denom
		}		
	}
}

// - End of JavaScript - -->
</script>
