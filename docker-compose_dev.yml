version: '3.7'

services:
  # MySQL
  mysql:
    container_name: mysql
    image: percona/percona-server:8.0
    restart: always
    cap_add:
      - SYS_NICE  # CAP_SYS_NICE
    command: mysqld --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - frontend
      - backend
    environment:
      MYSQL_ROOT_PASSWORD: 8Ap6dvSWVJ7r8U8x
      MYSQL_DATABASE: xcart_k
      MYSQL_USER: xcart_k
      MYSQL_PASSWORD: i250923lst
      SERVICE_NAME: app
      SERVICE_TAGS: dev
      TZ: EST
    ports:
      - '3306:3306'
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/my_dev.cnf:/etc/my.cnf.d/my.cnf


  # Nginx
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    networks:
      - frontend
    depends_on:
      - php
    tty: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php
    restart: unless-stopped
    networks:
      - frontend
      - backend
    depends_on:
      - mysql
      - redis
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
      PHP_IDE_CONFIG: serverName=localhost
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini

  redis:
    container_name: redis
    image: redis
    networks:
      - frontend
      - backend
    ports:
      - "6379:6379"
    volumes:
      - ./docker/redis/data:/data
    restart: always

  node:
    container_name: node
    image: "node:14"
    user: "node"
    working_dir: /home/node/app/www/static
    tty: true
    networks:
      - frontend
    #environment:
    #  - NODE_ENV=production
    volumes:
      - ./:/home/node/app


networks:
  frontend:
  backend:
