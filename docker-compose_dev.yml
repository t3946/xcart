version: '3.7'

services:
  # MySQL
  mysql:
    container_name: mysql
    image: percona/percona-server:8.0
    restart: always
    cap_add:
      - SYS_NICE  # CAP_SYS_NICE
    command: mysqld --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - frontend
      - backend
    environment:
      MYSQL_ROOT_PASSWORD: 8Ap6dvSWVJ7r8U8x
      MYSQL_DATABASE: xcart_k
      MYSQL_USER: xcart_k
      MYSQL_PASSWORD: i250923lst
      SERVICE_NAME: app
      SERVICE_TAGS: dev
      TZ: EST
    ports:
      - '3306:3306'
    volumes:
#      - ./docker/mysql/logs:/var/log/mysql
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/my_dev.cnf:/etc/my.cnf.d/my.cnf
      - ./docker/mysql/slave.cnf:/etc/my.cnf.d/repl.cnf


  # Nginx
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    networks:
      - frontend
    depends_on:
      - php
    tty: true
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
      - ./docker/nginx/configs/:/etc/nginx/configs/
      - ./docker/nginx/sites_dev/:/etc/nginx/sites-enabled.d/

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php
    restart: unless-stopped
    networks:
      - frontend
      - backend
#      - elastic
    depends_on:
      - mysql
      - redis
    tty: true
#    command: "/bin/sh -c 'while :; do sleep 1m & wait $${!}; php /var/www/app/console.php; done;'"
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
      PHP_IDE_CONFIG: serverName=localhost
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: 1
      XHGUI_PROFILING: 1
      XHGUI_SAVE_HANDLER: upload
    working_dir: /var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
      - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/dev.ini
      - ./docker/php/sendmail.ini:/usr/local/etc/php/conf.d/mail.ini
      - ./docker/php/msmtprc:/etc/msmtprc
      - ./docker/php/openssl.cnf:/etc/ssl/openssl.cnf
      - xhgui-vendor:/xhgui/vendor:ro

  redis:
    container_name: redis
    image: redis
    networks:
      - frontend
      - backend
    ports:
      - "6379:6379"
    restart: always
    privileged: true

  node:
    container_name: node
    image: "node:16"
    user: "node"
    working_dir: /home/node/app/nextjs
    tty: true
    ports:
      - "8080:3000"
    networks:
      - frontend
    #environment:
    #  - NODE_ENV=production
    volumes:
      - ./:/home/node/app
    command: npm run dev-client

  node-server:
    container_name: node-server
    image: "node:16"
    user: "node"
    working_dir: /home/node/app/nextjs
    tty: true
    ports:
      - "8081:3001"
    networks:
      - frontend
    #environment:
    #  - NODE_ENV=production
    volumes:
      - ./:/home/node/app
    command: npm run dev-server

  xhgui:
    image: frxyt/xhgui-dev
    ports:
      - 8070:80
    volumes:
      - xhgui-vendor:/xhgui/vendor:rw
    networks:
      - frontend
      - backend

volumes:
  xhgui-vendor:


networks:
  frontend:
  backend:
#  elastic:
